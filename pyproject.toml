[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oscardp"
version = "0.1.0"
description = "Shot-boundary detection and QC pipeline for OscarDP"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "torch>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
context = [
  "pymupdf>=1.24,<2",
  "srt>=3.5,<4",
  "rapidfuzz>=3.9,<4",
]
semantic = ["sentence-transformers>=3,<6"]
openai = ["openai>=2,<3"]
performance = ["opencv-python-headless>=4.10,<5"]
identity = ["insightface>=0.7,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
exclude = ["src/oscardp/vendor/transnetv2_pytorch.py"]
