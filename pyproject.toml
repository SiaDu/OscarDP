[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oscardp"
version = "0.1.0"
description = "Stage 01 shot detection for the Oscar Acting Dataset"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "openpyxl>=3.1.5",
  "Pillow>=10,<12",
  "pypdf>=6,<7",
  "torch==2.14.*",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
stage05 = ["opencv-python-headless>=4.10,<5"]
stage05-identity = ["opencv-python-headless>=4.10,<5", "onnxruntime>=1.20,<2", "onnx>=1.16,<2"]
stage05-performance = ["opencv-python-headless>=4.10,<5", "pyarrow>=18,<24", "matplotlib>=3.9,<4"]
stage06 = ["transformers>=4.51,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oscardp.stage02" = ["*.schema.json"]
"oscardp.stage05" = ["*.schema.json"]
"oscardp.stage05_review" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
exclude = ["src/oscardp/vendor/transnetv2_pytorch.py"]
