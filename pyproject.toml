[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oscardp"
version = "0.1.0"
description = "Stage 01 shot detection for the Oscar Acting Dataset"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "openpyxl>=3.1.5",
  "Pillow>=10,<12",
  "torch==2.14.*",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oscardp.stage02" = ["*.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
exclude = ["src/oscardp/vendor/transnetv2_pytorch.py"]
